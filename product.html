<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — Racheldesignscorner</title>
  <script src="js/theme-toggle.js"></script>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/utilities.css">
  <link rel="stylesheet" href="css/components/header.css">
  <link rel="stylesheet" href="css/components/footer.css">
  <link rel="stylesheet" href="css/components/products.css">
  <link rel="stylesheet" href="css/components/page.css">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo"><img src="https://i.etsystatic.com/62385400/r/isla/dad3f8/81233673/isla_100x100.81233673_b9sf6ld0.jpg" alt="Racheldesignscorner" class="logo-img"><span class="logo-text">Racheldesignscorner</span></a>
      <nav class="nav-desktop">
        <a href="index.html">Home</a>
        <a href="products.html">All Products</a>
        <a href="index.html#reviews">Reviews</a>
        <a href="index.html#about">About</a>
        <a href="index.html#contact">Contact</a>
      </nav>
      <div class="header-actions">
        <button class="theme-toggle" aria-label="Toggle theme">
          <span class="icon-moon">🌙</span>
          <span class="icon-sun">☀️</span>
        </button>
        <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>
  <nav class="nav-mobile">
    <div class="nav-mobile-header">
      <span class="logo"><span class="logo-text">Racheldesignscorner</span></span>
      <button class="nav-mobile-close" aria-label="Close">✕</button>
    </div>
    <a href="index.html">Home</a>
    <a href="products.html">All Products</a>
    <a href="index.html#reviews">Reviews</a>
    <a href="index.html#about">About</a>
    <a href="index.html#contact">Contact</a>
  </nav>
  <div class="overlay"></div>

  <!-- Breadcrumb -->
  <div class="container">
    <div class="breadcrumb">
      <a href="index.html">Home</a> &rsaquo;
      <a href="products.html">All Products</a> &rsaquo;
      <span id="breadcrumbCat"></span>
    </div>
  </div>

  <!-- Product Detail -->
  <div class="container page-body">
    <div class="product-detail" id="productDetail">
      <div class="pd-gallery">
        <img class="pd-main-img" id="pdMainImg" src="" alt="">
        <div class="pd-thumbs" id="pdThumbs"></div>
      </div>
      <div class="pd-info">
        <h1 class="pd-title" id="pdTitle"></h1>
        <p class="pd-price" id="pdPrice"></p>
        <div class="pd-dmca" style="margin:12px 0;">
          <a href="//www.dmca.com/Protection/Status.aspx?ID=617caf77-8e72-4710-88d8-ccf8db2d18e7" title="DMCA.com Protection Status" class="dmca-badge"><img src="https://images.dmca.com/Badges/_dmca_premi_badge_4.png?ID=617caf77-8e72-4710-88d8-ccf8db2d18e7" alt="DMCA.com Protection Status" /></a>
          <script src="https://images.dmca.com/Badges/DMCABadgeHelper.min.js"></script>
        </div>
        <p class="pd-category" id="pdCategory"></p>
        <div class="pd-variants" id="pdVariants"></div>
        <div class="pd-actions">
          <div class="pd-quantity">
            <button class="qty-btn qty-minus" id="qtyMinus">−</button>
            <input type="number" class="qty-input" value="1" min="1" max="99" id="pdQty">
            <button class="qty-btn qty-plus" id="qtyPlus">+</button>
          </div>
          <button class="btn-buy-now" id="buyNowBtn">Buy It Now</button>
        </div>
        <div class="pd-desc" id="pdDesc"></div>
        <div class="pd-tags" id="pdTags"></div>
      </div>
    </div>
  </div>

  <footer class="footer" style="margin-top:3rem;">
    <div class="container">
      <div class="footer-bottom">
        <span>© 2026 Racheldesignscorner. All rights reserved.</span>
      </div>
    </div>
  </footer>

  <script src="js/products-data.js"></script>
  <script src="js/page-product.js"></script>
  <script src="js/header.js"></script>
</body>
</html>
